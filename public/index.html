<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Dominó Cubano</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f7ff;font:16px system-ui}main{max-width:950px;margin:auto;padding:18px}h1{margin:0}.muted{color:#9eabc9}.card{background:#151c30;border:1px solid #2c3858;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{background:#1b2540;border-radius:14px;padding:14px;text-align:center}.score{font-size:48px;font-weight:900}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border-radius:9px;padding:10px;border:1px solid #2c3858}input,select{background:#0e1528;color:#fff}button{cursor:pointer;font-weight:700;background:#1b2540;color:#fff}.go{background:#86efac;color:#092513}.danger{color:#fda4af}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #2c3858;text-align:center}td:first-child,th:first-child{text-align:left}.code{font-size:22px;font-weight:900;letter-spacing:2px;color:#7dd3fc}.history{max-height:280px;overflow:auto}.entry{padding:8px 0;border-bottom:1px solid #2c3858}button:disabled,input:disabled,select:disabled{opacity:.45;cursor:not-allowed}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalCard{background:#17203a;border:1px solid #2c3858;border-radius:22px;padding:25px;max-width:520px;width:100%;text-align:center}.chicken{font-size:120px;display:block;animation:chicken .55s infinite alternate ease-in-out}@keyframes chicken{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(10deg) scale(1.16)}}.pollona{font-size:34px;font-weight:950;color:#fde68a}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1>Dominó Cubano</h1><div class="muted">Marcador a 100 · ganador se queda · cuentas separadas por rival</div>
<section class="card"><h3>Partida compartida</h3><div id="lobby" class="grid"><div><button class="go" onclick="createRoom()">Crear partida</button></div><div class="row"><input id="join" placeholder="Código"><button onclick="joinRoom()">Unirse</button></div></div><div id="room" hidden><div class="row">Código <span class="code" id="code"></span><button onclick="share()">Compartir</button><button onclick="leave()">Salir</button><button onclick="backup()">Exportar</button><label><button onclick="document.getElementById('file').click()">Importar</button><input hidden id="file" type="file" onchange="restore(event)"></label></div><div id="status" class="muted">Conectando…</div></div></section>
<section class="card"><h3>Partida actual</h3><div id="match"></div><div class="row" style="margin-top:12px"><select id="ma"></select><select id="mb"></select><button onclick="setMatch()">Cambiar equipos</button><button onclick="swap()">Intercambiar lados</button></div></section>
<div class="grid"><section class="card"><h3>Equipos</h3><div id="teams"></div><button onclick="addTeam()">+ Añadir equipo</button></section><section class="card"><h3>Historial</h3><div id="history" class="history"></div></section></div>
<section class="card"><h3>Partidas ganadas — cara a cara</h3><div style="overflow:auto"><table id="wins"></table></div></section>
<section class="card row"><button onclick="undo()">Deshacer última mano</button><button class="danger" onclick="resetScores()">Reiniciar puntuación</button><button class="danger" onclick="resetAll()">Reiniciar todo</button></section>
</main><div class="modal" id="winnerModal"><div class="modalCard" id="modalCard"></div></div><script>
const K='domino_state',RK='domino_room',TK='domino_token';const fresh=()=>({teams:[{id:'a',name:'Equipo A'},{id:'b',name:'Equipo B'},{id:'c',name:'Equipo C'}],active:['a','b'],queue:['c'],wins:{},partials:{},history:[]});let S=JSON.parse(localStorage.getItem(K)||'null')||fresh(),roomId=localStorage.getItem(RK)||'',token=localStorage.getItem(TK)||'',version=0,timer,dirty=false;
const n=id=>S.teams.find(x=>x.id===id)?.name||id,k=(a,b)=>[a,b].sort().join('|'),w=(a,b)=>S.wins[a+'>'+b]||0,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function part(a,b){let x=S.partials[k(a,b)]||{};return {[a]:x[a]||0,[b]:x[b]||0}}function save(){localStorage.setItem(K,JSON.stringify(S));render();if(roomId&&token){dirty=true;clearTimeout(timer);timer=setTimeout(push,250)}}function stat(s,bad=false){let e=document.getElementById('status');e.textContent=s;e.style.color=bad?'#fda4af':'#86efac'}
async function api(path,opt={}){let h={'content-type':'application/json',...(opt.headers||{})};if(token)h.authorization='Bearer '+token;let r=await fetch('/api'+path,{...opt,headers:h}),j=await r.json().catch(()=>({}));if(!r.ok){let e=new Error(j.error||'Error');e.status=r.status;e.data=j;throw e}return j}
async function createRoom(){try{let j=await api('/rooms',{method:'POST',body:JSON.stringify({state:S})});roomId=j.roomId;token=j.editToken;version=j.version;localStorage.setItem(RK,roomId);localStorage.setItem(TK,token);ui();stat('Sincronizado')}catch(e){alert(e.message)}}
async function joinRoom(idArg){let id=(idArg||document.getElementById('join').value).trim().toUpperCase();if(!id)return;try{token='';let j=await api('/rooms/'+id);roomId=id;version=j.version;S=j.state;localStorage.setItem(RK,id);localStorage.removeItem(TK);saveLocal();ui();render();stat('Modo espectador · sincronizado')}catch(e){alert(e.message)}}
function saveLocal(){localStorage.setItem(K,JSON.stringify(S))}async function push(){try{stat('Guardando…');let j=await api('/rooms/'+roomId,{method:'PUT',body:JSON.stringify({state:S,version})});version=j.version;dirty=false;stat('Sincronizado')}catch(e){if(e.status===409){S=e.data.state;version=e.data.version;dirty=false;saveLocal();render();stat('Se cargó una actualización más reciente',true)}else stat('Sin conexión',true)}}
async function pull(){if(!roomId||dirty)return;try{let j=await api('/rooms/'+roomId);if(j.version>version){version=j.version;S=j.state;saveLocal();render()}stat(token?'Sincronizado':'Modo espectador · sincronizado')}catch(e){stat('Sin conexión',true)}}
function applyReadonly(){let ro=!!(roomId&&!token);document.querySelectorAll('#match button,#match input,#ma,#mb,#teams input,#teams button,button[onclick="setMatch()"],button[onclick="swap()"],button[onclick="addTeam()"],button[onclick="undo()"],button[onclick="resetScores()"],button[onclick="resetAll()"],#file').forEach(el=>el.disabled=ro)}function ui(){document.getElementById('lobby').hidden=!!roomId;document.getElementById('room').hidden=!roomId;document.getElementById('code').textContent=roomId;applyReadonly()}
function share(){let u=new URL(location.href);u.search='';u.searchParams.set('room',roomId);navigator.share?navigator.share({title:'Dominó Cubano',text:'Código de partida: '+roomId,url:u.toString()}):navigator.clipboard.writeText('Código: '+roomId+' '+u.toString()).then(()=>alert('Código y enlace copiados'))}function leave(){roomId='';token='';version=0;localStorage.removeItem(RK);localStorage.removeItem(TK);ui()}
function backup(){let b=new Blob([JSON.stringify({format:'domino-cubano-backup',version:1,state:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='domino-cubano-respaldo.json';a.click();URL.revokeObjectURL(a.href)}
function restore(ev){if(roomId&&!token){alert('Esta copia está en modo espectador.');ev.target.value='';return}let f=ev.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let j=JSON.parse(r.result);S=j.state||j;save()}catch{alert('Respaldo no válido')}};r.readAsText(f)}
function normalize(){let ids=S.teams.map(t=>t.id);S.active=S.active.filter(x=>ids.includes(x)).slice(0,2);for(let x of ids)if(S.active.length<2&&!S.active.includes(x))S.active.push(x);S.queue=ids.filter(x=>!S.active.includes(x))}
function hand(){if(!token&&roomId)return alert('Esta copia está en modo espectador.');let[a,b]=S.active,A=Math.max(0,+document.getElementById('pa').value||0),B=Math.max(0,+document.getElementById('pb').value||0);if(!A&&!B)return;let before={teams:structuredClone(S.teams),active:[...S.active],queue:[...S.queue],wins:structuredClone(S.wins),partials:structuredClone(S.partials)},p=part(a,b),ra=p[a]+A,rb=p[b]+B;S.partials[k(a,b)]={[a]:ra,[b]:rb};let win=null,lose=null,poll=false;if(ra>=100||rb>=100){win=ra>=100&&rb>=100?(ra>=rb?a:b):(ra>=100?a:b);lose=win===a?b:a;poll=S.partials[k(a,b)][lose]===0;S.wins[win+'>'+lose]=w(win,lose)+1;S.partials[k(a,b)]={[a]:0,[b]:0};if(S.queue.length){let inc=S.queue.shift();S.active=[win,inc];S.queue.push(lose)}}S.history.push({a,b,A,B,ra,rb,win,lose,poll,before,time:Date.now()});save();if(win)showWinner(win,lose,poll,{[a]:ra,[b]:rb})}
function showWinner(win,lose,poll,fs){let next=S.active.length===2?esc(n(S.active[0]))+' vs '+esc(n(S.active[1])):'';modalCard.innerHTML=poll?'<span class="chicken">🐔</span><div class="pollona">¡POLLONA!</div><h2>'+esc(n(win))+' gana '+fs[win]+'–0</h2><p>Se añadió <strong>1 punto</strong> contra '+esc(n(lose))+'. Próxima partida: <strong>'+next+'</strong>.</p><button class="go" onclick="closeModal()">¡A jugar!</button>':'<h2>🏆 ¡'+esc(n(win))+' gana!</h2><p>Resultado: <strong>'+fs[win]+'–'+fs[lose]+'</strong>. Se añadió <strong>1 punto</strong> contra '+esc(n(lose))+'.</p><p>Próxima partida: <strong>'+next+'</strong>.</p><button class="go" onclick="closeModal()">Comenzar próxima partida</button>';winnerModal.classList.add('show');if(poll)chickenSound()}function chickenSound(){try{const A=window.AudioContext||window.webkitAudioContext,ctx=new A(),now=ctx.currentTime,m=ctx.createGain();m.gain.setValueAtTime(.0001,now);m.gain.exponentialRampToValueAtTime(.42,now+.03);m.gain.exponentialRampToValueAtTime(.0001,now+1.7);m.connect(ctx.destination);const scream=(st,dur,f1,f2)=>{const o=ctx.createOscillator(),g=ctx.createGain(),v=ctx.createOscillator(),vg=ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f1,now+st);o.frequency.exponentialRampToValueAtTime(f2,now+st+dur*.35);o.frequency.exponentialRampToValueAtTime(f1*.72,now+st+dur);v.frequency.value=26;vg.gain.value=95;v.connect(vg);vg.connect(o.frequency);g.gain.setValueAtTime(.0001,now+st);g.gain.exponentialRampToValueAtTime(.28,now+st+.025);g.gain.exponentialRampToValueAtTime(.0001,now+st+dur);o.connect(g);g.connect(m);o.start(now+st);v.start(now+st);o.stop(now+st+dur);v.stop(now+st+dur)};scream(0,.72,560,1250);scream(.48,.62,720,1450);scream(.96,.68,610,1320)}catch(e){}}function closeModal(){winnerModal.classList.remove('show')}function setMatch(){if(roomId&&!token)return alert('Esta copia está en modo espectador.');let a=ma.value,b=mb.value;if(a===b)return alert('Selecciona dos equipos diferentes.');S.active=[a,b];S.queue=S.teams.map(t=>t.id).filter(x=>x!==a&&x!==b);save()}function swap(){if(roomId&&!token)return alert('Esta copia está en modo espectador.');S.active.reverse();save()}function addTeam(){if(roomId&&!token)return alert('Esta copia está en modo espectador.');S.teams.push({id:'t'+Date.now(),name:'Equipo '+(S.teams.length+1)});save()}
function rename(id,v){if(roomId&&!token)return render();let t=S.teams.find(x=>x.id===id);t.name=v.trim()||'Equipo';save()}function del(id){if(roomId&&!token)return alert('Esta copia está en modo espectador.');if(S.teams.length<=2)return alert('Se requieren al menos dos equipos.');S.teams=S.teams.filter(x=>x.id!==id);for(let x of Object.keys(S.wins))if(x.split('>').includes(id))delete S.wins[x];for(let x of Object.keys(S.partials))if(x.split('|').includes(id))delete S.partials[x];normalize();save()}
function undo(){if(roomId&&!token)return alert('Esta copia está en modo espectador.');let h=S.history.at(-1);if(h?.before){let history=S.history.slice(0,-1);S={...h.before,history};save()}}function resetScores(){if(roomId&&!token)return alert('Esta copia está en modo espectador.');if(confirm('¿Reiniciar puntuaciones e historial?')){S.wins={};S.partials={};S.history=[];save()}}function resetAll(){if(roomId&&!token)return alert('Esta copia está en modo espectador.');if(confirm('¿Reiniciar todo?')){S=fresh();save()}}
function render(){normalize();let[a,b]=S.active,p=part(a,b);match.innerHTML='<div class="grid"><div class="team"><b>'+esc(n(a))+'</b><div class="score">'+p[a]+'</div><input id="pa" type="number" min="0" value="0"></div><div class="team"><b>'+esc(n(b))+'</b><div class="score">'+p[b]+'</div><input id="pb" type="number" min="0" value="0"></div></div><button class="go" style="width:100%;margin-top:10px" onclick="hand()">Registrar mano</button><div class="muted">En espera: '+S.queue.map(n).map(esc).join(' → ')+'</div>';let opts=S.teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('');ma.innerHTML=mb.innerHTML=opts;ma.value=a;mb.value=b;teams.innerHTML=S.teams.map(t=>'<div class="row"><input value="'+esc(t.name)+'" onchange="rename(\''+t.id+'\',this.value)"><button class="danger" onclick="del(\''+t.id+'\')">Eliminar</button></div>').join('');let ids=S.teams.map(t=>t.id),h='<tr><th>Equipo</th>'+ids.map(x=>'<th>vs '+esc(n(x))+'</th>').join('')+'<th>Total</th></tr>';for(let r of ids){let total=0;h+='<tr><td><b>'+esc(n(r))+'</b></td>';for(let c of ids){if(r===c)h+='<td>—</td>';else{let q=w(r,c);total+=q;h+='<td>'+q+'</td>'}}h+='<td><b>'+total+'</b></td></tr>'}wins.innerHTML=h;history.innerHTML=[...S.history].reverse().map(x=>'<div class="entry"><b>'+esc(n(x.a))+' +'+x.A+'</b> · '+esc(n(x.b))+' +'+x.B+'<div class="muted">'+x.ra+'–'+x.rb+(x.win?' · 🏆 '+esc(n(x.win))+(x.poll?' · 🐔 POLLONA':''):'')+'</div></div>').join('')||'<span class="muted">Todavía no hay manos.</span>';applyReadonly()}
async function syncTick(){if(document.visibilityState!=='visible'||!roomId)return;if(token&&dirty)await push();else await pull()}ui();render();let shared=new URLSearchParams(location.search).get('room');if(roomId)pull();else if(shared)joinRoom(shared);setInterval(syncTick,2000);addEventListener('online',syncTick);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncTick()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
</script></body></html>
